services:
  trading-bot:
    build: .
    container_name: kraken-trading-bot
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro
      - ./positions.json:/app/positions.json
      - ./trades_log.json:/app/trades_log.json
      - ./groq_log.json:/app/groq_log.json
    environment:
      - PYTHONUNBUFFERED=1

  dashboard:
    build: .
    container_name: kraken-dashboard
    restart: unless-stopped
    command: streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./.env:/app/.env:ro
      - ./positions.json:/app/positions.json
      - ./trades_log.json:/app/trades_log.json
      - ./groq_log.json:/app/groq_log.json
