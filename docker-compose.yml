services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_DB_PATH: /app/data/trading.db
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data          # trading.db: posizioni, trade, impostazioni

  dashboard:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_DB_PATH: /app/data/trading.db
    command: python dashboard.py
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
